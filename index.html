<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#11171b">
    <link rel="icon" href="favicon.ico" sizes="any">
    <title>MSGR — Geodezja i świadectwa energetyczne</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
        <a class="wordmark" href="#start" aria-label="MSGR — strona główna"><img src="logo.png" alt="MSGR — geodezja i świadectwa charakterystyki energetycznej"></a>
        <a class="header-contact" href="kontakt.html">Kontakt</a>
    </header>

    <main>
        <section class="hero" id="start" aria-label="Wybierz usługę">
            <div class="orbit-scene">
                <div class="orbit orbit-outer" aria-hidden="true"></div>
                <div class="orbit orbit-inner" aria-hidden="true"></div>
                <div class="orbit-glow" aria-hidden="true"></div>
                <img class="circle-image" src="Neonowy%20termiczny%20skan%20domu.png" alt="Termiczny skan domu jednorodzinnego i pomiar geodezyjny">

                <nav class="orbit-nav" aria-label="Wybierz usługę">
                    <a class="orbit-link link-geodezja" href="geodezja.html">
                        <img class="total-station" src="icons8-land-surveying-96.png" alt="" aria-hidden="true">
                        Geodezja
                    </a>
                    <a class="orbit-link link-swiadectwa" href="swiadectwa.html">
                        <svg class="thermal-camera" viewBox="0 0 100 120" aria-hidden="true">
                            <defs>
                                <linearGradient id="thermal-screen" x1="0" y1="0" x2="1" y2="1">
                                    <stop stop-color="#00d9f4"></stop>
                                    <stop offset=".48" stop-color="#b6ff16"></stop>
                                    <stop offset="1" stop-color="#ff4f91"></stop>
                                </linearGradient>
                            </defs>
                            <path d="M25 10h45a9 9 0 0 1 9 9v35H17V19a9 9 0 0 1 8-9Z" fill="#17272c" stroke="#75eaf1" stroke-width="3"></path>
                            <path d="M24 18h47v23H24z" fill="#0c1a20" stroke="#b6ff16" stroke-width="2"></path>
                            <circle cx="47.5" cy="29.5" r="8" fill="url(#thermal-screen)" stroke="#fff" stroke-width="2"></circle>
                            <path d="M17 49h62v8H17z" fill="#26383c" stroke="#75eaf1" stroke-width="2"></path>
                            <path d="m27 57 42 1-7 48a7 7 0 0 1-7 6H41a7 7 0 0 1-7-6z" fill="#17272c" stroke="#75eaf1" stroke-width="3" stroke-linejoin="round"></path>
                            <path d="m36 68 27 1m-25 8 24 1m-22 8 21 1" stroke="url(#thermal-screen)" stroke-width="3" stroke-linecap="round"></path>
                            <path d="M24 48h48" stroke="#ff4f91" stroke-width="2"></path>
                        </svg>
                        <span class="certificate-label">Świadectwa Charakterystyki Energetycznej</span>
                    </a>
                </nav>
            </div>
        </section>
    </main>

    <footer class="site-footer" id="kontakt">
        <a class="footer-company" href="#start">MSGR sp. z o.o.</a>
        <div class="footer-contact">
            <a href="tel:+48798367400">+48 798 367 400</a>
            <a href="mailto:geotechnix@op.pl">geotechnix@op.pl</a>
            <span class="footer-tax">NIP: 6572957653</span>
        </div>
        <p>Wszelkie prawa zastrzeżone © 2026</p>
    </footer>
</body>
</html>
